<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="title desc">
  <title id="title">what-changed-files</title>
  <desc id="desc">what-changed-files reports the files a push or pull request changed, from git alone. Zero dependencies, no build, no network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10212b"/>
      <stop offset="1" stop-color="#16303a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>
    <rect width="8" height="260" fill="#ff7a59"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="56" y="108" font-size="52" font-weight="700" fill="#f2e3c6">what<tspan fill="#ff7a59">-</tspan>changed<tspan fill="#ff7a59">-</tspan>files</text>
    <text x="58" y="150" font-size="19" fill="#b9c7c9">The files a push or pull request changed, from git alone.</text>

    <g font-size="13" font-weight="600" text-anchor="middle" fill="#f2e3c6">
      <rect x="56" y="180" width="128" height="30" rx="15" fill="#f2e3c6" fill-opacity="0.08" stroke="#f2e3c6" stroke-opacity="0.35"/>
      <text x="120" y="200">0 dependencies</text>
      <rect x="196" y="180" width="88" height="30" rx="15" fill="#f2e3c6" fill-opacity="0.08" stroke="#f2e3c6" stroke-opacity="0.35"/>
      <text x="240" y="200">no build</text>
      <rect x="296" y="180" width="104" height="30" rx="15" fill="#f2e3c6" fill-opacity="0.08" stroke="#f2e3c6" stroke-opacity="0.35"/>
      <text x="348" y="200">no network</text>
    </g>
  </g>

  <line x1="640" y1="44" x2="640" y2="216" stroke="#f2e3c6" stroke-opacity="0.15"/>

  <g font-family="Consolas, Menlo, 'Liberation Mono', monospace" font-size="16">
    <g transform="translate(676 42)">
      <rect width="28" height="28" rx="6" fill="#7ee0b5"/>
      <text x="14" y="20" text-anchor="middle" font-weight="700" fill="#10212b">A</text>
      <text x="44" y="20" fill="#7ee0b5">src/glob.ts</text>
    </g>
    <g transform="translate(676 86)">
      <rect width="28" height="28" rx="6" fill="#f6c453"/>
      <text x="14" y="20" text-anchor="middle" font-weight="700" fill="#10212b">M</text>
      <text x="44" y="20" fill="#f6c453">src/index.ts</text>
    </g>
    <g transform="translate(676 130)">
      <rect width="28" height="28" rx="6" fill="#ff7a59"/>
      <text x="14" y="20" text-anchor="middle" font-weight="700" fill="#10212b">D</text>
      <text x="44" y="20" fill="#ff7a59" text-decoration="line-through">dist/main.js</text>
    </g>
    <g transform="translate(676 174)">
      <rect width="28" height="28" rx="6" fill="#7cc4f0"/>
      <text x="14" y="20" text-anchor="middle" font-weight="700" fill="#10212b">R</text>
      <text x="44" y="20" fill="#7cc4f0">docs/how-to.md</text>
    </g>
  </g>
</svg>
