name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: "package.json"

      # No install step: the action and its tests have no dependencies.
      - name: Run tests
        run: npm test

  self-test:
    name: Self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Run the action
        id: changed
        uses: ./
        with:
          files_ignore: "**/*.md"
          files_yaml: |
            src:
              - src/**
            test:
              - test/**
            meta:
              - action.yml
              - .github/**
          dir_names: true
          dir_names_max_depth: 1
          matrix: true

      - name: Verify outputs
        env:
          DIRS: ${{ steps.changed.outputs.all_changed_files }}
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          SRC_ANY_CHANGED: ${{ steps.changed.outputs.src_any_changed }}
          CHANGED_KEYS: ${{ steps.changed.outputs.changed_keys }}
        run: |
          echo "dirs=$DIRS any_changed=$ANY_CHANGED src_any_changed=$SRC_ANY_CHANGED changed_keys=$CHANGED_KEYS"
          jq --exit-status 'type == "array"' <<<"$DIRS" >/dev/null
          jq --exit-status 'type == "array"' <<<"$CHANGED_KEYS" >/dev/null
          [[ "$ANY_CHANGED" =~ ^(true|false)$ && "$SRC_ANY_CHANGED" =~ ^(true|false)$ ]]

  lint:
    name: Lint
    # zizmor-action uses Docker and requires a runner with a Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: "package.json"
          cache: npm

      - name: Configure npm
        uses: lowlydba/sustainable-npm@31d51025884f424f58f22e4e6578178bb4e79632 # v3

      - name: Install dev dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          advanced-security: false

  are-we-good:
    name: Are We Good?
    runs-on: ubuntu-latest
    needs: [test, self-test, lint]
    if: always()
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Are we good?
        uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
